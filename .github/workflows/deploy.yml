name: Deploy MyST site to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; don't cancel a running deploy midway.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Project pages are served under /<repo-name>/
  BASE_URL: /${{ github.event.repository.name }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install MyST
        run: npm install -g mystmd
      - name: Build HTML
        run: myst build --html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _build/html

  deploy:
    # Only publish from main; PRs just verify that the site builds.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
